<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Smart Parking App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;1000&display=swap" rel="stylesheet">
  <style>
    body, html, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      font-family: 'Cairo', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #F4F6FB;
    }
    * {
      font-family: 'Cairo', sans-serif;
    }
    input, textarea, button {
      font-family: 'Cairo', sans-serif;
    }
    @media (min-width: 600px) {
      #root {
        max-width: 440px;
        margin: 0 auto;
        box-shadow: 0 0 40px rgba(15, 23, 42, 0.15);
      }
    }
    #root:empty::after {
      content: '';
      width: 34px;
      height: 34px;
      margin: auto;
      border: 4px solid rgba(24,153,214,0.25);
      border-top-color: #1899D6;
      border-radius: 50%;
      animation: bootspin 0.9s linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
